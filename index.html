<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Устав группы "МИРА"</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0a1a2a 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            padding: 12px;
            padding-bottom: 80px;
        }
        .main-wrapper {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }
        .box {
            background: rgba(15, 25, 45, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 25px;
            margin: 16px auto;
            width: 100%;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #ffd966;
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .subtitle {
            color: #ffaa66;
            text-align: center;
            font-size: 16px;
            margin-bottom: 25px;
        }

        /* ===== КНОПКИ СТАТЕЙ ===== */
        .search-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
        }
        .search-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
            white-space: nowrap;
            text-decoration: none;
            display: inline-block;
        }
        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }
        .search-btn:active {
            transform: translateY(0px);
        }
        .search-btn.gold {
            background: linear-gradient(135deg, #fdcb6e, #f39c12);
            box-shadow: 0 4px 10px rgba(243, 156, 18, 0.3);
            color: #2d3436;
        }
        .search-btn.gold:hover {
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.5);
        }
        .search-btn.orange {
            background: linear-gradient(135deg, #ffb347, #ff8c00);
            box-shadow: 0 4px 10px rgba(255, 140, 0, 0.3);
        }
        .search-btn.orange:hover {
            box-shadow: 0 6px 20px rgba(255, 140, 0, 0.5);
        }
        .search-btn.green {
            background: linear-gradient(135deg, #00b894, #00cec9);
            box-shadow: 0 4px 10px rgba(0, 206, 201, 0.3);
        }
        .search-btn.green:hover {
            box-shadow: 0 6px 20px rgba(0, 206, 201, 0.5);
        }
        .search-btn.purple {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
        }
        .search-btn.purple:hover {
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.5);
        }
        .search-btn.red {
            background: linear-gradient(135deg, #e17055, #d63031);
            box-shadow: 0 4px 10px rgba(214, 48, 49, 0.3);
        }
        .search-btn.red:hover {
            box-shadow: 0 6px 20px rgba(214, 48, 49, 0.5);
        }
        .search-btn.pink {
            background: linear-gradient(135deg, #fd79a8, #e84393);
            box-shadow: 0 4px 10px rgba(232, 67, 147, 0.3);
        }
        .search-btn.pink:hover {
            box-shadow: 0 6px 20px rgba(232, 67, 147, 0.5);
        }
        .search-btn.teal {
            background: linear-gradient(135deg, #00b894, #0984e3);
            box-shadow: 0 4px 10px rgba(9, 132, 227, 0.3);
        }
        .search-btn.teal:hover {
            box-shadow: 0 6px 20px rgba(9, 132, 227, 0.5);
        }
        .search-btn.blue {
            background: linear-gradient(135deg, #0984e3, #6c5ce7);
            box-shadow: 0 4px 10px rgba(9, 132, 227, 0.3);
        }
        .search-btn.blue:hover {
            box-shadow: 0 6px 20px rgba(9, 132, 227, 0.5);
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .reset-btn {
            background: linear-gradient(135deg, #636e72, #2d3436);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            text-decoration: none;
            display: inline-block;
        }
        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
        }

        .content {
            color: #e0e0e0;
            line-height: 1.8;
            font-size: 15px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 10px;
            scroll-behavior: smooth;
        }
        .content::-webkit-scrollbar {
            width: 6px;
        }
        .content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .content::-webkit-scrollbar-thumb {
            background: #ffd966;
            border-radius: 10px;
        }
        .content h2 {
            color: #ffd966;
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 20px;
        }
        .content h3 {
            color: #ffaa66;
            margin-top: 15px;
            margin-bottom: 8px;
            font-size: 17px;
        }
        .content strong {
            color: #ffd966;
        }

        /* ===== ЯКОРЯ ===== */
        .anchor {
            scroll-margin-top: 20px;
            display: block;
        }

        .info-text {
            color: #888;
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
        }

        /* ===== КНОПКА ВЕРНУТЬСЯ НА ГЛАВНУЮ ===== */
        .home-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 35px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            background: linear-gradient(180deg, #00b894, #00cec9);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 206, 201, 0.4);
            width: fit-content;
            max-width: 100%;
            margin: 5px auto 20px auto;
            line-height: 1.3;
        }
        .home-btn:hover {
            transform: translateY(-3px) scale(1.02);
            background: linear-gradient(180deg, #00d2a0, #00e5e0);
            box-shadow: 0 12px 35px rgba(0, 206, 201, 0.6);
        }
        .home-btn:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 4px 15px rgba(0, 206, 201, 0.3);
        }

        @media (max-width: 600px) {
            .search-btn {
                padding: 8px 14px;
                font-size: 12px;
            }
            .box {
                padding: 15px;
            }
            h1 {
                font-size: 22px;
            }
            .home-btn {
                padding: 12px 24px;
                font-size: 15px;
                border-radius: 40px;
                gap: 8px;
                margin: 5px auto 15px auto;
            }
        }
        @media (max-width: 400px) {
            .home-btn {
                padding: 10px 18px;
                font-size: 13px;
                border-radius: 30px;
                gap: 6px;
            }
        }
    </style>
</head>
<body>
    <!-- ВЕСЬ HTML КОД ОСТАЕТСЯ БЕЗ ИЗМЕНЕНИЙ -->
    <!-- ... ваш код ... -->
</body>
</html>
